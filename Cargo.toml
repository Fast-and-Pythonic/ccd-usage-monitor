[package]
name = "ccd-usage-monitor"
version = "0.1.0"
edition = "2024"
description = "A floating readout of Claude Code quota and context usage for Windows. Built with Slint (https://slint.dev) under its royalty-free licence."


[dependencies]
chrono = "0.4.45"
dirs = "6.0.0"
raw-window-handle = "0.6"
# Pinned to an exact version, and the backend and renderer named rather than
# left to `default`: G05 was a renderer changing under us and taking
# transparency with it, and every figure in the docs was measured on femtovg.
slint = { version = "=1.17.1", default-features = false, features = [
   "backend-winit",
   "renderer-femtovg",
   "compat-1-2",
   "raw-window-handle-06",
   "std",
] }
slint-interpreter = { version = "=1.17.1", default-features = false, features = [
   "backend-winit",
   "renderer-femtovg",
   "compat-1-2",
   "display-diagnostics",
   "raw-window-handle-06",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
toml_edit = { version = "0.25", features = ["serde"] }
tray-icon = "0.24.2"
ureq = "3.4.0"

[build-dependencies]
# The settings window is compiled; the pill's theme is not (A20, A24).
slint-build = "=1.17.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
   "Win32_Foundation",
   "Win32_Graphics_Dwm",
   "Win32_Graphics_Gdi",
   "Win32_System_LibraryLoader",
   "Win32_UI_WindowsAndMessaging",
   "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# For running the widget while working on it: optimised like `release`, but
# without whole-program LTO on one codegen unit, which is what makes a release
# build take the better part of ten minutes on a two-core machine. Builds into
# `target/quick/`, so it never touches the `release` binary the status line
# runs. `release` stays for what is published.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
