[package]
name = "ccd-usage-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "6.0.0"
eframe = "0.36.1"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
toml_edit = { version = "0.25", features = ["serde"] }
tray-icon = "0.24.2"
ureq = "3.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
